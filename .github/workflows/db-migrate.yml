name: DB Migration Release

run-name: "Production DB migration: ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Audit performs read-only release checks; deploy applies only the verified pending suffix."
        required: true
        default: audit
        type: choice
        options:
          - audit
          - deploy

concurrency:
  group: panellako-production-db-migration
  cancel-in-progress: false

jobs:
  migration-release:
    name: Audit or deploy the exact migration release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
    env:
      PANELLAKO_PROJECT_REF: wzromwxpjlyrqbdiapep
      SUPABASE_PROJECT_ID: wzromwxpjlyrqbdiapep
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_CLI_VERSION: 2.116.0
      MIGRATION_MANIFEST: .github/migration-manifests/20260830120000_multitenancy-release.sha256
      EXPECTED_MIGRATION_VERSION: "20260830120000"

    steps:
      - name: Checkout the requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fail closed on mode, target, branch, and secrets
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.mode }}" in
            audit|deploy) ;;
            *) echo "Unsupported release mode." >&2; exit 1 ;;
          esac
          if [ "${{ inputs.mode }}" = "deploy" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Production deploy is restricted to refs/heads/main." >&2
            exit 1
          fi
          if [ "${PANELLAKO_PROJECT_REF}" != "wzromwxpjlyrqbdiapep" ] || [ "${SUPABASE_PROJECT_ID}" != "${PANELLAKO_PROJECT_REF}" ]; then
            echo "Unexpected Supabase project target." >&2
            exit 1
          fi
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is required}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD is required}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Verify the immutable migration manifest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "${MIGRATION_MANIFEST}"
          node scripts/validate-migration-release.mjs manifest \
            --manifest "${MIGRATION_MANIFEST}"

      - name: Verify the pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(npx --yes supabase@2.116.0 --version)"
          if [ "${ACTUAL_VERSION}" != "${SUPABASE_CLI_VERSION}" ]; then
            echo "Unexpected Supabase CLI version." >&2
            exit 1
          fi

      - name: Link the fixed PanelLakó project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 link \
            --project-ref "${PANELLAKO_PROJECT_REF}" \
            --password "${SUPABASE_DB_PASSWORD}"

      - name: Capture and validate the remote migration plan
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION_LIST="${RUNNER_TEMP}/migration-list.initial.json"
          DRY_RUN="${RUNNER_TEMP}/db-push-dry-run.initial.json"
          npx --yes supabase@2.116.0 migration list --linked --output-format json > "${MIGRATION_LIST}"
          npx --yes supabase@2.116.0 db push --linked --skip-vault --dry-run --output-format json > "${DRY_RUN}"
          node scripts/validate-migration-release.mjs state \
            --manifest "${MIGRATION_MANIFEST}" \
            --migration-list "${MIGRATION_LIST}" \
            --dry-run "${DRY_RUN}" \
            --expect suffix

      - name: Require a fresh Supabase platform backup
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          BACKUP_RESPONSE="${RUNNER_TEMP}/platform-backups.json"
          trap 'rm -f "${BACKUP_RESPONSE}"' EXIT
          umask 077
          HTTP_CODE="$(curl --silent --show-error \
            --output "${BACKUP_RESPONSE}" \
            --write-out "%{http_code}" \
            "https://api.supabase.com/v1/projects/${PANELLAKO_PROJECT_REF}/database/backups" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Supabase platform backup status is unavailable (HTTP ${HTTP_CODE})." >&2
            exit 1
          fi
          node scripts/validate-migration-release.mjs backup \
            --backup "${BACKUP_RESPONSE}" \
            --now-epoch "$(date +%s)"

      - name: Recheck the plan and deploy through the migration ledger
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION_LIST="${RUNNER_TEMP}/migration-list.predeploy.json"
          DRY_RUN="${RUNNER_TEMP}/db-push-dry-run.predeploy.json"
          sha256sum -c "${MIGRATION_MANIFEST}"
          npx --yes supabase@2.116.0 migration list --linked --output-format json > "${MIGRATION_LIST}"
          npx --yes supabase@2.116.0 db push --linked --skip-vault --dry-run --output-format json > "${DRY_RUN}"
          node scripts/validate-migration-release.mjs state \
            --manifest "${MIGRATION_MANIFEST}" \
            --migration-list "${MIGRATION_LIST}" \
            --dry-run "${DRY_RUN}" \
            --expect suffix
          npx --yes supabase@2.116.0 db push --linked --skip-vault --yes

      - name: Verify the production migration ledger and schema
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION_LIST="${RUNNER_TEMP}/migration-list.postdeploy.json"
          DRY_RUN="${RUNNER_TEMP}/db-push-dry-run.postdeploy.json"
          npx --yes supabase@2.116.0 migration list --linked --output-format json > "${MIGRATION_LIST}"
          npx --yes supabase@2.116.0 db push --linked --skip-vault --dry-run --output-format json > "${DRY_RUN}"
          node scripts/validate-migration-release.mjs state \
            --manifest "${MIGRATION_MANIFEST}" \
            --migration-list "${MIGRATION_LIST}" \
            --dry-run "${DRY_RUN}" \
            --expect clean
          bash scripts/verify-production-multitenancy.sh
