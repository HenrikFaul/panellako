name: DB Verify

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify PanelLakó production multitenancy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run read-only production verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash scripts/verify-production-multitenancy.sh
