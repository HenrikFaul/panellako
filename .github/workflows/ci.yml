name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write    # CodeQL/SARIF upload (semgrep + trivy)
  pull-requests: write      # gitleaks-action commenting on PRs

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Typecheck
        run: npm run typecheck

  lint:
    name: Lint (next lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Lint
        run: npm run lint

  build:
    name: Build (next build)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Build
        env:
          # Stubs only — Next collects env at build time but never reaches Supabase in CI
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key-for-ci-build
          # Disable telemetry to keep CI logs clean
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history so gitleaks can scan all commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Picks up .gitleaks.toml at the repo root automatically
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v6
      - name: Semgrep scan
        env:
          SEMGREP_RULES: >-
            p/nextjs
            p/typescript
            p/react
            p/owasp-top-ten
            p/secrets
        run: |
          semgrep ci \
            --config=auto \
            --config=.semgrep.yml \
            --sarif --output=semgrep.sarif \
            --metrics=off || true
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Vuln scan (trivy fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trivy filesystem + lockfile scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy.sarif'
          skip-dirs: 'node_modules,.next,growth_strategy/fonts,valuation/fonts'
      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
