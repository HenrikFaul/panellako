name: Production DB Password Rotation

run-name: Production DB password rotation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ROTATE:PANELLAKO-DB-PASSWORD to authorize the production credential rotation."
        required: true
        default: ""

concurrency:
  group: panellako-production-db-migration
  cancel-in-progress: false

jobs:
  rotate:
    name: Rotate and verify the PanelLako production database password
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
    env:
      PANELLAKO_PROJECT_REF: wzromwxpjlyrqbdiapep
      SUPABASE_CLI_VERSION: 2.116.0

    steps:
      - name: Checkout the authorized main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fail closed on repository, branch, actor, confirmation, target, and secrets
        env:
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" != "HenrikFaul/panellako" ]; then
            echo "Unexpected repository." >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Password rotation is restricted to refs/heads/main." >&2
            exit 1
          fi
          if [ "${GITHUB_ACTOR}" != "HenrikFaul" ]; then
            echo "Password rotation is restricted to the repository owner." >&2
            exit 1
          fi
          if [ "${CONFIRM}" != "ROTATE:PANELLAKO-DB-PASSWORD" ]; then
            echo "The exact project-specific confirmation is required." >&2
            exit 1
          fi
          if [ "${PANELLAKO_PROJECT_REF}" != "wzromwxpjlyrqbdiapep" ]; then
            echo "Unexpected Supabase project target." >&2
            exit 1
          fi
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN is required}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD is required}"
          echo "::add-mask::${SUPABASE_ACCESS_TOKEN}"
          echo "::add-mask::${SUPABASE_DB_PASSWORD}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Verify the pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_VERSION="$(npx --yes supabase@2.116.0 --version)"
          if [ "${ACTUAL_VERSION}" != "${SUPABASE_CLI_VERSION}" ]; then
            echo "Unexpected Supabase CLI version." >&2
            exit 1
          fi

      - name: Rotate through the official Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          REQUEST_BODY="$(mktemp)"
          RESPONSE_BODY="$(mktemp)"
          cleanup() {
            rm -f "${REQUEST_BODY}" "${RESPONSE_BODY}"
          }
          trap cleanup EXIT

          jq -n --arg password "${SUPABASE_DB_PASSWORD}" \
            '{password: $password}' > "${REQUEST_BODY}"
          HTTP_STATUS="$(curl --silent --show-error \
            --request PATCH \
            --output "${RESPONSE_BODY}" \
            --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/${PANELLAKO_PROJECT_REF}/database/password" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data-binary "@${REQUEST_BODY}")"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Supabase rejected the database password rotation (HTTP ${HTTP_STATUS})." >&2
            exit 1
          fi
          echo "Supabase accepted the password rotation. Waiting for credential propagation."

      - name: Verify the rotated credential without exposing it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERIFIED=false
          for ATTEMPT in 1 2 3 4 5 6; do
            if npx --yes supabase@2.116.0 link \
              --project-ref "${PANELLAKO_PROJECT_REF}" \
              --password "${SUPABASE_DB_PASSWORD}" >/dev/null 2>&1 && \
              npx --yes supabase@2.116.0 migration list --linked --output-format json \
                >/tmp/panellako-migration-list.json 2>/dev/null; then
              VERIFIED=true
              break
            fi
            if [ "${ATTEMPT}" -lt 6 ]; then
              sleep 20
            fi
          done
          if [ "${VERIFIED}" != "true" ]; then
            echo "The rotated credential did not become usable within the bounded retry window." >&2
            exit 1
          fi
          jq -e '.migrations | type == "array"' /tmp/panellako-migration-list.json >/dev/null
          rm -f /tmp/panellako-migration-list.json
          echo "Rotated credential verification passed."
