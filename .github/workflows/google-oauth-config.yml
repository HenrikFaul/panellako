name: Google OAuth Provider Configure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Írd be: IGEN:PANELLAKO-GOOGLE-OAUTH – a production konfiguráció jóváhagyásához'
        required: true
        default: ''

concurrency:
  group: production-google-oauth-config
  cancel-in-progress: false

jobs:
  configure:
    name: Configure PanelLakó production Google OAuth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions: {}

    steps:
      - name: Guard – repository, main branch, actor és jóváhagyás
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REPOSITORY" != "HenrikFaul/panellako" ]; then
            echo "❌ A workflow kizárólag a HenrikFaul/panellako repositoryban futhat."
            exit 1
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ A production workflow kizárólag a main ágról futtatható."
            exit 1
          fi

          if [ "$GITHUB_ACTOR" != "HenrikFaul" ]; then
            echo "❌ A production workflow csak a repository tulajdonosa által futtatható."
            exit 1
          fi

          if [ "$CONFIRM" != "IGEN:PANELLAKO-GOOGLE-OAUTH" ]; then
            echo "❌ A production konfigurációhoz a projekt-specifikus jóváhagyás szükséges."
            exit 1
          fi

          echo "✅ Repository-, branch-, actor- és jóváhagyási kapu PASS."

      - name: Configure Google provider through Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.PANELLAKO_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.PANELLAKO_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          umask 077

          for required_value in \
            "$SUPABASE_ACCESS_TOKEN" \
            "$GOOGLE_OAUTH_CLIENT_ID" \
            "$GOOGLE_OAUTH_CLIENT_SECRET"; do
            if [ -z "$required_value" ]; then
              echo "❌ Hiányzik egy kötelező production secret."
              exit 1
            fi
            echo "::add-mask::$required_value"
          done

          API_URL="https://api.supabase.com/v1/projects/wzromwxpjlyrqbdiapep/config/auth"
          REQUIRED_SITE_URL="https://panellako.hu"
          REQUIRED_REDIRECT="https://panellako.hu/auth/callback"
          BEFORE_BODY=$(mktemp)
          REQUEST_BODY=$(mktemp)
          PATCH_BODY=$(mktemp)
          VERIFY_BODY=$(mktemp)
          AUTHORIZE_BODY=$(mktemp)
          ROLLBACK_BODY=$(mktemp)
          ROLLBACK_RESPONSE=$(mktemp)
          ROLLBACK_VERIFY_RESPONSE=$(mktemp)
          ROLLBACK_ARMED=false

          cleanup() {
            STATUS=$?
            trap - EXIT

            if [ "$STATUS" -ne 0 ] && [ "$ROLLBACK_ARMED" = "true" ]; then
              jq -n \
                --arg site_url "$CURRENT_SITE_URL" \
                --arg uri_allow_list "$CURRENT_ALLOW_LIST" \
                --argjson email_optional "$CURRENT_EMAIL_OPTIONAL" \
                --argjson skip_nonce "$CURRENT_SKIP_NONCE" \
                '{
                  site_url: $site_url,
                  external_google_enabled: false,
                  external_google_email_optional: $email_optional,
                  external_google_skip_nonce_check: $skip_nonce,
                  uri_allow_list: $uri_allow_list
                }' > "$ROLLBACK_BODY"

              ROLLBACK_STATUS=$(curl --silent --show-error \
                --request PATCH \
                --output "$ROLLBACK_RESPONSE" \
                --write-out "%{http_code}" \
                "$API_URL" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary "@$ROLLBACK_BODY" || true)

              ROLLBACK_VERIFY_STATUS=$(curl --silent --show-error \
                --output "$ROLLBACK_VERIFY_RESPONSE" \
                --write-out "%{http_code}" \
                "$API_URL" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" || true)

              if [ "$ROLLBACK_STATUS" = "200" ] \
                && [ "$ROLLBACK_VERIFY_STATUS" = "200" ] \
                && jq -e \
                  --arg expected_site_url "$CURRENT_SITE_URL" \
                  --arg expected_allow_list "$CURRENT_ALLOW_LIST" '
                    .external_google_enabled == false
                    and .site_url == $expected_site_url
                    and (.uri_allow_list // "") == $expected_allow_list
                  ' "$ROLLBACK_VERIFY_RESPONSE" >/dev/null; then
                echo "✅ Sikertelen utóellenőrzés után a Google provider letiltása, valamint a Site URL és az Auth allowlist visszaállítása read-back alapján PASS."
              else
                echo "❌ A fail-closed rollback nem igazolható (PATCH HTTP ${ROLLBACK_STATUS:-unknown}, read-back HTTP ${ROLLBACK_VERIFY_STATUS:-unknown})."
              fi
            fi

            rm -f \
              "$BEFORE_BODY" "$REQUEST_BODY" "$PATCH_BODY" "$VERIFY_BODY" \
              "$AUTHORIZE_BODY" "$ROLLBACK_BODY" "$ROLLBACK_RESPONSE" \
              "$ROLLBACK_VERIFY_RESPONSE"
            exit "$STATUS"
          }
          trap cleanup EXIT

          BEFORE_STATUS=$(curl --silent --show-error \
            --output "$BEFORE_BODY" \
            --write-out "%{http_code}" \
            "$API_URL" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")

          if [ "$BEFORE_STATUS" != "200" ]; then
            echo "❌ A production Auth konfiguráció nem olvasható (HTTP $BEFORE_STATUS)."
            exit 1
          fi

          if ! jq -e 'type == "object"' "$BEFORE_BODY" >/dev/null; then
            echo "❌ A production Auth konfiguráció válasza nem érvényes JSON objektum."
            exit 1
          fi

          CURRENT_SITE_URL=$(jq -r '.site_url // ""' "$BEFORE_BODY")
          CURRENT_GOOGLE_ENABLED=$(jq -r '.external_google_enabled // false' "$BEFORE_BODY")
          CURRENT_GOOGLE_CLIENT_ID=$(jq -r '.external_google_client_id // ""' "$BEFORE_BODY")
          CURRENT_EMAIL_OPTIONAL=$(jq -r '.external_google_email_optional // false' "$BEFORE_BODY")
          CURRENT_SKIP_NONCE=$(jq -r '.external_google_skip_nonce_check // false' "$BEFORE_BODY")
          CURRENT_ALLOW_LIST=$(jq -r '.uri_allow_list // ""' "$BEFORE_BODY")

          if [[ ! "$CURRENT_SITE_URL" =~ ^https://(panellako\.hu|panellako\.vercel\.app)/?$ ]]; then
            CURRENT_SITE_ORIGIN=$(CURRENT_SITE_URL="$CURRENT_SITE_URL" python3 -c 'import os, urllib.parse; parsed = urllib.parse.urlparse(os.environ["CURRENT_SITE_URL"]); port = f":{parsed.port}" if parsed.port else ""; print(f"{parsed.scheme}://{parsed.hostname}{port}" if parsed.scheme in {"http", "https"} and parsed.hostname else "invalid")')
            echo "ℹ️  A jelenlegi production Auth site origin: $CURRENT_SITE_ORIGIN"
            echo "❌ A production site URL nem jóváhagyott PanelLakó origin; automatikus átírás tiltott."
            exit 1
          fi

          if [ "$CURRENT_GOOGLE_ENABLED" != "false" ]; then
            echo "❌ A Google provider már aktív; az élő konfiguráció automatikus felülírása tiltott."
            exit 1
          fi

          if [ -n "$CURRENT_GOOGLE_CLIENT_ID" ] && [ "$CURRENT_GOOGLE_CLIENT_ID" != "$GOOGLE_OAUTH_CLIENT_ID" ]; then
            echo "❌ Eltérő Google kliens-ID található; az élő credential automatikus felülírása tiltott."
            exit 1
          fi

          NEW_ALLOW_LIST=$(jq -nr \
            --arg current "$CURRENT_ALLOW_LIST" \
            --arg required "$REQUIRED_REDIRECT" '
              ($current
                | split(",")
                | map(gsub("^\\s+|\\s+$"; ""))
                | map(select(length > 0))) as $existing
              | reduce ($existing + [$required])[] as $url
                  ([]; if index($url) == null then . + [$url] else . end)
              | join(",")
            ')

          jq -n \
            --arg site_url "$REQUIRED_SITE_URL" \
            --arg client_id "$GOOGLE_OAUTH_CLIENT_ID" \
            --arg client_secret "$GOOGLE_OAUTH_CLIENT_SECRET" \
            --arg uri_allow_list "$NEW_ALLOW_LIST" \
            '{
              site_url: $site_url,
              external_google_enabled: true,
              external_google_client_id: $client_id,
              external_google_secret: $client_secret,
              external_google_email_optional: false,
              external_google_skip_nonce_check: false,
              uri_allow_list: $uri_allow_list
            }' > "$REQUEST_BODY"

          PATCH_STATUS=$(curl --silent --show-error \
            --request PATCH \
            --output "$PATCH_BODY" \
            --write-out "%{http_code}" \
            "$API_URL" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$REQUEST_BODY")

          if [ "$PATCH_STATUS" != "200" ]; then
            echo "❌ A Google provider konfiguráció sikertelen (HTTP $PATCH_STATUS)."
            exit 1
          fi

          ROLLBACK_ARMED=true

          VERIFY_STATUS=$(curl --silent --show-error \
            --output "$VERIFY_BODY" \
            --write-out "%{http_code}" \
            "$API_URL" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")

          if [ "$VERIFY_STATUS" != "200" ]; then
            echo "❌ A Google provider utóellenőrzése sikertelen (HTTP $VERIFY_STATUS)."
            exit 1
          fi

          if ! jq -e \
            --arg expected_client_id "$GOOGLE_OAUTH_CLIENT_ID" \
            --arg required_site_url "$REQUIRED_SITE_URL" \
            --arg required_redirect "$REQUIRED_REDIRECT" '
              (.site_url | rtrimstr("/")) == $required_site_url
              and .external_google_enabled == true
              and .external_google_client_id == $expected_client_id
              and .external_google_email_optional == false
              and .external_google_skip_nonce_check == false
              and (
                ((.uri_allow_list // "")
                  | split(",")
                  | map(gsub("^\\s+|\\s+$"; ""))
                  | index($required_redirect)) != null
              )
            ' \
            "$VERIFY_BODY" >/dev/null; then
            echo "❌ A Google provider utóellenőrzése eltérést talált."
            exit 1
          fi

          RUNTIME_REDIRECT="${REQUIRED_REDIRECT}?next=%2Fapp"
          ENCODED_REDIRECT=$(RUNTIME_REDIRECT="$RUNTIME_REDIRECT" python3 -c \
            'import os, urllib.parse; print(urllib.parse.quote(os.environ["RUNTIME_REDIRECT"], safe=""))')
          PKCE_CHALLENGE="dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"
          AUTHORIZE_URL="https://wzromwxpjlyrqbdiapep.supabase.co/auth/v1/authorize?provider=google&redirect_to=$ENCODED_REDIRECT&scopes=openid&code_challenge=$PKCE_CHALLENGE&code_challenge_method=s256"
          AUTHORIZE_READY=false

          # A Management API read-back hamarabb láthatja az új értéket, mint az
          # Auth runtime. Csak ezt az egy, pontosan azonosított átmeneti állapotot
          # próbáljuk újra; minden más hiba azonnal fail-closed marad.
          for ATTEMPT in $(seq 1 12); do
            AUTHORIZE_RESULT=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --output "$AUTHORIZE_BODY" \
              --write-out "%{http_code}\n%{redirect_url}" \
              "$AUTHORIZE_URL")
            AUTHORIZE_STATUS=$(echo "$AUTHORIZE_RESULT" | head -1)
            AUTHORIZE_REDIRECT=$(echo "$AUTHORIZE_RESULT" | tail -1)
            AUTHORIZE_HOST=$(AUTHORIZE_REDIRECT="$AUTHORIZE_REDIRECT" python3 -c \
              'import os, urllib.parse; print(urllib.parse.urlparse(os.environ["AUTHORIZE_REDIRECT"]).hostname or "")')
            AUTHORIZE_SCOPES_OK=$(AUTHORIZE_REDIRECT="$AUTHORIZE_REDIRECT" python3 -c \
              'import os, urllib.parse; query = urllib.parse.parse_qs(urllib.parse.urlparse(os.environ["AUTHORIZE_REDIRECT"]).query); scopes = set(query.get("scope", [""])[0].split()); print("true" if {"openid", "email", "profile"}.issubset(scopes) else "false")')

            if { [ "$AUTHORIZE_STATUS" = "302" ] || [ "$AUTHORIZE_STATUS" = "303" ]; } \
              && [ "$AUTHORIZE_HOST" = "accounts.google.com" ] \
              && [ "$AUTHORIZE_SCOPES_OK" = "true" ]; then
              AUTHORIZE_READY=true
              break
            fi

            if { [ "$AUTHORIZE_STATUS" = "302" ] || [ "$AUTHORIZE_STATUS" = "303" ]; } \
              && [ "$AUTHORIZE_HOST" != "accounts.google.com" ]; then
              echo "❌ A hosted Google authorize canary nem a Google hitelesítési domainre irányított."
              exit 1
            fi

            if { [ "$AUTHORIZE_STATUS" = "302" ] || [ "$AUTHORIZE_STATUS" = "303" ]; } \
              && [ "$AUTHORIZE_SCOPES_OK" != "true" ]; then
              echo "❌ A hosted Google authorize canary nem igazolta az openid, email és profile scope-okat."
              exit 1
            fi

            AUTHORIZE_ERROR_CODE=$(jq -r '.error_code // ""' "$AUTHORIZE_BODY" 2>/dev/null || true)
            AUTHORIZE_ERROR_MESSAGE=$(jq -r '.msg // ""' "$AUTHORIZE_BODY" 2>/dev/null || true)
            if [ "$AUTHORIZE_STATUS" = "400" ] \
              && [ "$AUTHORIZE_ERROR_CODE" = "validation_failed" ] \
              && [ "$AUTHORIZE_ERROR_MESSAGE" = "Unsupported provider: provider is not enabled" ] \
              && [ "$ATTEMPT" -lt 12 ]; then
              echo "ℹ️  Az Auth runtime konfigurációja még terjed; újrapróbálás ($ATTEMPT/12)."
              sleep 5
              continue
            fi

            echo "❌ A hosted Google authorize canary nem adott elfogadható választ (HTTP $AUTHORIZE_STATUS, error_code=${AUTHORIZE_ERROR_CODE:-none})."
            exit 1
          done

          if [ "$AUTHORIZE_READY" != "true" ]; then
            echo "❌ A hosted Google authorize canary 60 másodpercen belül sem vált aktívvá."
            exit 1
          fi

          ROLLBACK_ARMED=false
          echo "✅ Production Google OAuth provider, redirect allowlist, read-back és hosted authorize canary PASS."
